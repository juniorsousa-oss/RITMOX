name: RITMOX live regression tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  live-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: https://ritmox.onrender.com
      EXPECTED_BUILD: "20260926-56"
    steps:
      - uses: actions/checkout@v4

      - name: Validate signed anamnesis save and PDF locally six times
        shell: bash
        env:
          DATABASE_URL: sqlite:////tmp/ritmox-v45-test.db
        run: |
          python -m pip install --quiet -r requirements.txt
          python - <<'PY'
          import json, base64
          from io import BytesIO
          from PIL import Image, ImageDraw
          import app
          from sqlalchemy import select

          db=app.DB()
          try:
              questions=db.scalars(select(app.AnamnesisQuestion).where(app.AnamnesisQuestion.active == True).order_by(app.AnamnesisQuestion.position,app.AnamnesisQuestion.id)).all()
              answers={}
              for q in questions:
                  opts=json.loads(q.options_json or "[]")
                  if q.question_type=="yes_no": answers[str(q.id)]=False
                  elif q.question_type=="multiselect": answers[str(q.id)]=[opts[0]] if opts else ["Teste"]
                  elif q.question_type=="select": answers[str(q.id)]=opts[0] if opts else "Teste"
                  elif q.question_type=="date": answers[str(q.id)]="1990-01-01"
                  elif q.question_type=="number": answers[str(q.id)]=1
                  else: answers[str(q.id)]="Teste"

              img=Image.new("RGBA",(500,140),(255,255,255,0))
              draw=ImageDraw.Draw(img)
              draw.line([(30,90),(110,55),(180,95),(260,48),(360,88),(455,62)],fill=(255,45,122,255),width=8)
              bio=BytesIO(); img.save(bio,format="PNG")
              signature="data:image/png;base64,"+base64.b64encode(bio.getvalue()).decode()

              for i in range(1,7):
                  data=app.DynamicHealthAssessmentIn(
                      answers=answers,
                      consent_truthful=True,
                      consent_screening=True,
                      signature_name=f"Aluno Teste {i}",
                      signature_data=signature,
                      signature_confirmed=True,
                  )
                  result=app.save_health_assessment(data,db)
                  assert result["signature_status"]=="signed", result
                  item=db.get(app.HealthAssessment,result["id"])
                  pdf=app._assessment_pdf_buffer(item).getvalue()
                  assert pdf[:4]==b"%PDF"
                  assert len(pdf)>1000
                  print(f"PASS signed save/PDF {i}/6",result["id"],len(pdf))
          finally:
              db.close()
          PY

      - name: Wait for Render build
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..70}; do
            body="$(curl -fsS --max-time 20 "$APP_URL/health" || true)"
            echo "attempt=$attempt body=$body"
            if echo "$body" | grep -q "$EXPECTED_BUILD" && echo "$body" | grep -q '"persistent":true'; then
              echo "Persistent PostgreSQL confirmed."
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Install browser runtime
        run: npm install --no-save playwright-core

      - name: Validate exact approved home-card images six times
        shell: bash
        run: |
          node <<'NODE'
          const { chromium }=require('playwright-core');
          const APP=process.env.APP_URL;
          (async()=>{
            const browser=await chromium.launch({
              executablePath:'/usr/bin/google-chrome',
              headless:true,
              args:['--no-sandbox','--disable-dev-shm-usage']
            });
            try{
              for(let i=1;i<=6;i++){
                const p=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
                await p.goto(APP+'/?approvedExact=v49-'+i,{waitUntil:'networkidle',timeout:120000});

                const checks=[
                  ['strength',p.locator('.m-feature-strength'),'/static/assets/home/home-strength-approved-exact-v48.webp?v=20260925-49','workouts'],
                  ['run',p.locator('.m-feature-run'),'/static/assets/home/home-run-approved-exact-v48.webp?v=20260925-49','run']
                ];
                for(const [name,card,expected] of checks){
                  await card.waitFor({state:'visible',timeout:30000});
                  const art=card.locator('.home-card-art');
                  const info=await art.evaluate(img=>({
                    src:img.getAttribute('src')||'',
                    complete:img.complete,
                    naturalWidth:img.naturalWidth,
                    naturalHeight:img.naturalHeight,
                    display:getComputedStyle(img).display,
                    objectFit:getComputedStyle(img).objectFit,
                    transform:getComputedStyle(img).transform
                  }));
                  if(info.src!==expected) throw new Error(name+' wrong exact approved image '+info.src);
                  if(!info.complete||info.naturalWidth!==760||info.naturalHeight!==184) throw new Error(name+' source dimensions '+JSON.stringify(info));
                  if(info.display!=='block'||info.objectFit!=='contain'||info.transform!=='none') throw new Error(name+' image styling '+JSON.stringify(info));
                  const copy=card.locator('.m-feature-copy');
                  const arrow=card.locator('.m-feature-arrow');
                  if(await copy.count() && await copy.evaluate(el=>getComputedStyle(el).display)!=='none') throw new Error(name+' duplicate copy visible');
                  if(await arrow.count() && await arrow.evaluate(el=>getComputedStyle(el).display)!=='none') throw new Error(name+' duplicate arrow visible');
                  const b=await card.boundingBox();
                  if(Math.abs((b.width/b.height)-(760/184))>0.03) throw new Error(name+' ratio mismatch '+(b.width/b.height));
                }

                const sb=await p.locator('.m-feature-strength').boundingBox();
                const rb=await p.locator('.m-feature-run').boundingBox();
                if(Math.abs(sb.x-rb.x)>.5||Math.abs(sb.width-rb.width)>.5||Math.abs(sb.height-rb.height)>.5){
                  throw new Error('cards not aligned '+JSON.stringify({sb,rb}));
                }

                await p.locator('.m-feature-strength').click();
                if(!p.url().includes('#workouts')) throw new Error('strength whole-card click failed');
                await p.goto(APP+'/?approvedExactRun=v49-'+i,{waitUntil:'networkidle',timeout:120000});
                await p.locator('.m-feature-run').click();
                if(!p.url().includes('#run')) throw new Error('run whole-card click failed');

                console.log('PASS exact approved cards '+i+'/6');
                if(i===6){
                  await p.goto(APP+'/?approvedExactShot=v49',{waitUntil:'networkidle',timeout:120000});
                  await p.screenshot({path:'ritmox-v49-home.png',fullPage:true});
                }
                await p.close();
              }

              const d=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
              await d.goto(APP+'/?approvedExactDesktop=v49',{waitUntil:'networkidle',timeout:120000});
              for(const [name,card,expected] of [
                ['strength',d.locator('.strength-card'),'/static/assets/home/home-strength-approved-exact-v48.webp?v=20260925-49'],
                ['run',d.locator('.run-card'),'/static/assets/home/home-run-approved-exact-v48.webp?v=20260925-49']
              ]){
                await card.waitFor({state:'visible',timeout:30000});
                if((await card.locator('.home-card-art').getAttribute('src'))!==expected) throw new Error('desktop '+name+' wrong asset');
                for(const sel of ['.hero-card-head','.hero-card-body','.hero-action']){
                  const el=card.locator(sel);
                  if(await el.count() && await el.evaluate(x=>getComputedStyle(x).display)!=='none') throw new Error('desktop '+name+' duplicate '+sel);
                }
              }
              await d.close();
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Validate explicit anamnesis errors and signature six times
        shell: bash
        run: |
          node <<'NODE'
          const { chromium }=require('playwright-core');
          const APP=process.env.APP_URL;
          (async()=>{
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              for(let i=1;i<=6;i++){
                const p=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
                await p.goto(APP+'/?anamnesisValidation=v45-'+i,{waitUntil:'networkidle',timeout:120000});
                await p.evaluate(async()=>{
                  await loadAnamnesisFormConfig(true);
                  renderDynamicAnamnesis();
                  openDialogSafe(document.querySelector('#healthAssessmentDialog'));
                  setupHealthSignaturePad();
                  clearAnamnesisFeedback();
                });
                await p.locator('#haSignatureCanvas').waitFor({state:'visible',timeout:30000});
                const multi=await p.locator('[data-anamnesis-option]').count();
                if(!multi) throw new Error('no multiselect options');
                await p.locator('[data-anamnesis-option]').first().click();
                const collected=await p.evaluate(()=>collectDynamicAnswers());
                if(!Object.values(collected).some(v=>Array.isArray(v)&&v.length>0)) throw new Error('multiselect collection failed');

                await p.locator('#submitHealthAssessmentBtn').click();
                const feedback=p.locator('#anamnesisFormFeedback');
                await feedback.waitFor({state:'visible',timeout:10000});
                const msg=await feedback.textContent();
                if(!msg.includes('pendências')) throw new Error('missing explicit error: '+msg);

                const canvas=p.locator('#haSignatureCanvas');
                const b=await canvas.boundingBox();
                await p.mouse.move(b.x+40,b.y+70); await p.mouse.down();
                await p.mouse.move(b.x+110,b.y+45,{steps:5}); await p.mouse.move(b.x+180,b.y+80,{steps:5}); await p.mouse.up();
                if(!await p.evaluate(()=>state.health.signatureHasInk)) throw new Error('signature did not register');
                await p.locator('#haConsentTruthful').click();
                await p.locator('#haConsentScreening').click();
                await p.locator('#haSignatureConfirm').click();
                if(await p.locator('#haSignatureConfirm').getAttribute('aria-checked')!=='true') throw new Error('signature confirmation failed');
                console.log('PASS error/signature '+i+'/6');
                await p.close();
              }
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Validate approved profile and calendar layouts six times
        shell: bash
        run: |
          node <<'NODE'
          const { chromium }=require('playwright-core');
          const APP=process.env.APP_URL;
          (async()=>{
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              for(let i=1;i<=6;i++){
                const p=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
                await p.goto(APP+'/?layoutV50='+i,{waitUntil:'networkidle',timeout:120000});

                await p.locator('.bottom-nav [data-page="profile"]').click();
                await p.locator('.profile-hero-card').waitFor({state:'visible',timeout:30000});
                await p.waitForFunction(()=>document.querySelector('#profileNameTitle')?.textContent?.trim().length>0);
                if(await p.locator('.profile-quick-actions button').count()!==1) throw new Error('profile quick actions mismatch');
                if(await p.locator('.profile-info-card .profile-info-readonly').count()!==4) throw new Error('personal rows mismatch');
                if(await p.locator('.profile-info-card button').count()!==0) throw new Error('personal info must be read-only');
                if(await p.locator('.profile-admin-card .profile-info-row').count()!==3) throw new Error('admin rows mismatch');
                await p.locator('#editProfileBtn').click();
                await p.locator('#profileEditDialog').waitFor({state:'visible',timeout:10000});
                if(await p.locator('#profileEditName').count()!==1) throw new Error('profile edit fields missing');
                await p.locator('#cancelProfileEditBtn').click();

                // Photo crop: 100% must fit the entire selected image inside the white crop area.
                const svg=Buffer.from('<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1000"><rect width="600" height="1000" fill="%23121a2c"/><rect x="80" y="80" width="440" height="840" fill="%23ff2d7a"/></svg>');
                await p.locator('#profilePhotoInput').setInputFiles({name:'perfil.svg',mimeType:'image/svg+xml',buffer:svg});
                await p.locator('#profilePhotoCropDialog').waitFor({state:'visible',timeout:10000});
                if(await p.locator('#profilePhotoCropCanvas').count()!==1) throw new Error('photo crop canvas missing');
                if(await p.locator('#profilePhotoZoomRange').count()!==1) throw new Error('photo crop zoom missing');

                const fit=await p.evaluate(()=>{
                  const m=profilePhotoCropMetrics();
                  const r=profilePhotoCropRect();
                  return {w:m.width,h:m.height,size:r.size,zoom:state.photoCrop.zoom};
                });
                if(Math.abs(fit.zoom-1)>.001) throw new Error('photo crop initial zoom '+fit.zoom);
                if(fit.w>fit.size+1||fit.h>fit.size+1) throw new Error('100% does not fit full photo '+JSON.stringify(fit));
                if(Math.abs(Math.max(fit.w,fit.h)-fit.size)>1) throw new Error('fit scale mismatch '+JSON.stringify(fit));

                await p.locator('#profilePhotoZoomRange').evaluate((el)=>{el.value='1.50';el.dispatchEvent(new Event('input',{bubbles:true}));});
                const zoomText=await p.locator('#profilePhotoZoomValue').textContent();
                if(zoomText!=='150%') throw new Error('photo crop zoom did not update: '+zoomText);
                const preview=await p.evaluate(()=>getProfilePhotoCropDataUrl());
                if(!preview.startsWith('data:image/jpeg;base64,')) throw new Error('photo crop output invalid');
                await p.locator('#profilePhotoRecenterBtn').click();
                await p.locator('#cancelProfilePhotoCropBtn').click();
                if(await p.locator('#profilePhotoCropDialog').isVisible().catch(()=>false)) throw new Error('photo crop did not close');

                await p.locator('.bottom-nav [data-page="workouts"]').click();
                await p.evaluate(()=>{
                  const gate=document.querySelector('#healthGate');
                  const cal=document.querySelector('#trainingCalendar');
                  if(gate) gate.hidden=true;
                  if(cal) cal.hidden=false;
                  state.calendar.weekStart=startOfWeek(new Date());
                  state.calendar.selectedDate=localISO(new Date());
                  state.calendar.plans=[];
                  renderTrainingCalendar();
                });
                await p.locator('#weekCalendar').waitFor({state:'visible',timeout:10000});
                const addBox=await p.locator('#addPlanDayBtn').boundingBox();
                if(Math.abs(addBox.width-48)>1||Math.abs(addBox.height-48)>1) throw new Error('day add button misaligned '+JSON.stringify(addBox));
                const cards=await p.locator('.calendar-day').count();
                if(cards!==7) throw new Error('calendar days '+cards);
                const firstBox=await p.locator('.calendar-day').first().boundingBox();
                if(Math.abs(firstBox.width-71)>1) throw new Error('calendar card width '+firstBox.width);
                if(await p.locator('.day-empty-icon').count()!==1) throw new Error('day empty icon missing');

                console.log('PASS approved profile/calendar '+i+'/6');
                if(i===6) await p.screenshot({path:'ritmox-v53-profile-calendar.png',fullPage:true});
                await p.close();
              }
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Validate profile persistence locally six times
        shell: bash
        env:
          DATABASE_URL: sqlite:////tmp/ritmox-profile-v50.db
        run: |
          python -m pip install --quiet -r requirements.txt
          python - <<'PY'
          import app
          db=app.DB()
          try:
              for i in range(1,7):
                  data=app.UserProfileIn(
                      name=f"Júnior {i}",
                      email=f"junior{i}@ritmox.com",
                      birth_date="1998-03-15",
                      goals="Hipertrofia e performance",
                      photo_data="",
                  )
                  out=app.update_user_profile(data,db)
                  assert out["name"]==f"Júnior {i}"
                  assert out["email"]==f"junior{i}@ritmox.com"
                  assert out["birth_date"]=="1998-03-15"
                  print(f"PASS profile persistence {i}/6")
          finally:
              db.close()
          PY

      - name: Validate approved workout/profile layout six times
        shell: bash
        run: |
          node <<'NODE'
          const { chromium }=require('playwright-core');
          const APP=process.env.APP_URL;
          (async()=>{
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              for(let i=1;i<=6;i++){
                const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
                await page.goto(APP+'/?approvedLayout=v53-'+i,{waitUntil:'networkidle',timeout:120000});

                // Profile: approved structure + clickable customization.
                await page.locator('.bottom-nav [data-page="profile"]').click();
                await page.locator('.ritmox-profile-v53').waitFor({state:'visible',timeout:30000});
                const hero=await page.locator('.profile-hero-card').boundingBox();
                const anam=await page.locator('#profileAnamnesisCard').boundingBox();
                if(!hero||!anam||Math.abs(hero.x-anam.x)>.5||Math.abs(hero.width-anam.width)>.5){
                  throw new Error('profile cards misaligned '+JSON.stringify({hero,anam}));
                }
                await page.locator('#editProfileBtn').click();
                await page.locator('#profileEditDialog').waitFor({state:'visible',timeout:10000});
                await page.locator('#cancelProfileEditBtn').click();

                // Workout: plus aligned inside selected-day header.
                await page.locator('.bottom-nav [data-page="workouts"]').click();
                const calendar=page.locator('#trainingCalendar');
                if(await calendar.isVisible().catch(()=>false)){
                  const panel=await page.locator('.day-panel').boundingBox();
                  const plus=await page.locator('#addPlanDayBtn').boundingBox();
                  const head=await page.locator('.day-panel-head').boundingBox();
                  if(!panel||!plus||!head) throw new Error('missing calendar geometry');
                  const rightGap=(panel.x+panel.width)-(plus.x+plus.width);
                  const topGap=plus.y-head.y;
                  if(rightGap<12||rightGap>20||topGap<-10||topGap>1){
                    throw new Error('day plus misaligned '+JSON.stringify({rightGap,topGap,panel,plus,head}));
                  }
                }
                console.log('PASS approved workout/profile '+i+'/6');
                if(i===6) await page.screenshot({path:'ritmox-v53-approved.png',fullPage:true});
                await page.close();
              }
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload v53 screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ritmox-v53-live-validation
          path: ritmox-v53-profile-calendar.png
          if-no-files-found: ignore
