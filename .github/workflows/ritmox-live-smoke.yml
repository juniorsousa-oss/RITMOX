name: RITMOX live smoke tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_URL: https://ritmox.onrender.com
      EXPECTED_BUILD: "20260925-35"
    steps:
      - name: Wait for Render build
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            body="$(curl -fsS --max-time 20 "$APP_URL/api/version" || true)"
            echo "attempt=$attempt body=$body"
            if echo "$body" | grep -q "$EXPECTED_BUILD"; then
              exit 0
            fi
            sleep 10
          done
          echo "Render did not publish $EXPECTED_BUILD within the test window."
          exit 1

      - name: Install browser test runtime
        run: npm install --no-save playwright-core

      - name: Run six repeated muscle-icon tests
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const APP = process.env.APP_URL;
          const expected = process.env.EXPECTED_BUILD;
          const results = [];

          function pass(name, ok, details) {
            results.push({name, ok, details});
            console.log(`${ok ? 'PASS' : 'FAIL'} :: ${name} :: ${details}`);
          }

          (async () => {
            const browser = await chromium.launch({
              executablePath:'/usr/bin/google-chrome',
              headless:true,
              args:['--no-sandbox','--disable-dev-shm-usage']
            });
            try {
              for (let i=1;i<=6;i++) {
                const page = await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
                await page.goto(`${APP}/?muscleIconTest=${i}&build=${expected}`,{waitUntil:'networkidle',timeout:120000});
                const card = page.locator('.m-feature-strength');
                const icon = page.locator('.m-feature-strength .m-feature-icon');
                const img = page.locator('.m-feature-strength .m-feature-icon img');
                const copy = page.locator('.m-feature-strength .m-feature-copy');
                await img.waitFor({state:'visible',timeout:30000});

                const data = await img.evaluate(el => {
                  const r = el.getBoundingClientRect();
                  const s = getComputedStyle(el);
                  return {
                    src: el.getAttribute('src'),
                    complete: el.complete,
                    naturalWidth: el.naturalWidth,
                    naturalHeight: el.naturalHeight,
                    width: r.width,
                    height: r.height,
                    objectFit: s.objectFit,
                    transform: s.transform,
                    clipPath: s.clipPath
                  };
                });
                const ib = await icon.boundingBox();
                const xb = await img.boundingBox();
                const cb = await copy.boundingBox();
                const gap = cb.x - (ib.x + ib.width);
                const inside =
                  xb.x >= ib.x - 0.5 &&
                  xb.y >= ib.y - 0.5 &&
                  xb.x + xb.width <= ib.x + ib.width + 0.5 &&
                  xb.y + xb.height <= ib.y + ib.height + 0.5;

                const ok =
                  data.complete &&
                  data.naturalWidth > 0 &&
                  data.naturalHeight > 0 &&
                  data.src.includes(`muscle-approved.png?v=${expected}`) &&
                  Math.abs(data.width - 58) < 0.6 &&
                  Math.abs(data.height - 58) < 0.6 &&
                  Math.abs(ib.width - 58) < 0.6 &&
                  Math.abs(ib.height - 58) < 0.6 &&
                  data.objectFit === 'contain' &&
                  data.transform === 'none' &&
                  data.clipPath === 'none' &&
                  inside &&
                  gap >= 17.5;

                pass(
                  `muscle icon repetition ${i}/6`,
                  ok,
                  JSON.stringify({data,iconBox:ib,imageBox:xb,textGap:gap,inside})
                );

                await card.screenshot({path:`muscle-icon-test-${i}.png`});
                await page.close();
              }

              if (results.some(r=>!r.ok)) process.exit(1);
              console.log('RESULTS='+JSON.stringify(results));
            } finally {
              await browser.close();
            }
          })().catch(err=>{console.error(err);process.exit(1);});
          NODE

      - name: Upload six rendered icon screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ritmox-muscle-icon-v35
          path: muscle-icon-test-*.png
          if-no-files-found: error
