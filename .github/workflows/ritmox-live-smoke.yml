name: RITMOX live regression tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      APP_URL: https://ritmox.onrender.com
      EXPECTED_BUILD: "20260925-41"
    steps:
      - name: Wait for Render build
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..70}; do
            body="$(curl -fsS --max-time 20 "$APP_URL/api/version" || true)"
            echo "attempt=$attempt body=$body"
            if echo "$body" | grep -q "$EXPECTED_BUILD"; then exit 0; fi
            sleep 10
          done
          echo "Render did not publish $EXPECTED_BUILD"
          exit 1

      - name: Install browser runtime
        run: npm install --no-save playwright-core

      - name: Repeat declaration checkbox behavior six times
        shell: bash
        run: |
          node <<'NODE'
          const { chromium }=require('playwright-core');
          const APP=process.env.APP_URL;
          (async()=>{
            const browser=await chromium.launch({
              executablePath:'/usr/bin/google-chrome',
              headless:true,
              args:['--no-sandbox','--disable-dev-shm-usage']
            });
            try{
              for(let i=1;i<=6;i++){
                const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
                await page.goto(APP+'/?declarationTest='+i,{waitUntil:'networkidle',timeout:120000});
                await page.evaluate(async()=>{
                  await loadAnamnesisFormConfig(true);
                  renderDynamicAnamnesis();
                  openDialogSafe(document.querySelector('#healthAssessmentDialog'));
                });
                const truthful=page.locator('#haConsentTruthful');
                const screening=page.locator('#haConsentScreening');
                const signature=page.locator('#haRequestSignature');
                await truthful.waitFor({state:'visible',timeout:30000});

                if(await truthful.getAttribute('aria-checked')!=='false') throw new Error('truthful initial state invalid');
                if(await screening.getAttribute('aria-checked')!=='false') throw new Error('screening initial state invalid');

                await truthful.click();
                await screening.click();
                await signature.click();

                const a=await truthful.getAttribute('aria-checked');
                const b=await screening.getAttribute('aria-checked');
                const s=await signature.getAttribute('aria-checked');
                if(a!=='true'||b!=='true'||s!=='true'){
                  throw new Error('toggle failed '+JSON.stringify({a,b,s,iteration:i}));
                }

                await truthful.click();
                if(await truthful.getAttribute('aria-checked')!=='false'){
                  throw new Error('second truthful toggle failed on iteration '+i);
                }
                await truthful.click();
                if(await truthful.getAttribute('aria-checked')!=='true'){
                  throw new Error('third truthful toggle failed on iteration '+i);
                }

                console.log('PASS declarations '+i+'/6');
                await page.close();
              }
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Validate baked whole-card images and clicks
        shell: bash
        run: |
          node <<'NODE'
          const { chromium }=require('playwright-core');
          const APP=process.env.APP_URL;
          (async()=>{
            const browser=await chromium.launch({
              executablePath:'/usr/bin/google-chrome',
              headless:true,
              args:['--no-sandbox','--disable-dev-shm-usage']
            });
            try{
              const mobile=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
              await mobile.goto(APP+'/?homeCardTest=mobile',{waitUntil:'networkidle',timeout:120000});
              for(const sel of ['.m-feature-strength','.m-feature-run']){
                const card=mobile.locator(sel);
                await card.waitFor({state:'visible',timeout:30000});
                if(await card.locator('.m-feature-icon').count()) throw new Error(sel+' contains separate icon');
                const art=card.locator('.home-card-art');
                const src=await art.getAttribute('src');
                if(!src||!src.includes('/static/assets/home/')) throw new Error(sel+' missing baked image');
                const natural=await art.evaluate(img=>({complete:img.complete,w:img.naturalWidth,h:img.naturalHeight}));
                if(!natural.complete||natural.w<200||natural.h<80) throw new Error(sel+' baked image failed '+JSON.stringify(natural));
              }
              await mobile.locator('.m-feature-strength').click();
              if(!mobile.url().includes('#workouts')) throw new Error('mobile strength whole-card click failed');
              await mobile.goto(APP+'/?homeCardTest=mobile-run',{waitUntil:'networkidle'});
              await mobile.locator('.m-feature-run').click();
              if(!mobile.url().includes('#run')) throw new Error('mobile run whole-card click failed');
              await mobile.close();

              const desktop=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
              await desktop.goto(APP+'/?homeCardTest=desktop',{waitUntil:'networkidle',timeout:120000});
              for(const sel of ['.strength-card','.run-card']){
                const card=desktop.locator(sel);
                await card.waitFor({state:'visible',timeout:30000});
                if(await card.locator('.hero-icon').count()) throw new Error(sel+' contains separate icon');
                const src=await card.locator('.home-card-art').getAttribute('src');
                if(!src||!src.includes('/static/assets/home/')) throw new Error(sel+' missing baked desktop image');
              }
              console.log('PASS baked whole-card images');
              await desktop.close();
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Validate profile anamnesis and PDF API
        shell: bash
        run: |
          set -euo pipefail
          profile="$(curl -fsS "$APP_URL/api/profile/anamnesis")"
          echo "$profile" > /tmp/profile.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/profile.json'))
          assert set(('latest','history','count')).issubset(p)
          assert isinstance(p['history'], list)
          assert isinstance(p['count'], int)
          print('PROFILE_COUNT',p['count'])
          PY

          assessment_id="$(python - <<'PY'
          import json
          p=json.load(open('/tmp/profile.json'))
          print((p.get('latest') or {}).get('id') or '')
          PY
          )"
          if [ -n "$assessment_id" ]; then
            curl -fsS "$APP_URL/api/health-assessment/$assessment_id/pdf" -o /tmp/anamnesis.pdf
            test "$(head -c 4 /tmp/anamnesis.pdf)" = "%PDF"
            test "$(wc -c < /tmp/anamnesis.pdf)" -gt 1000
            echo "PASS profile PDF for assessment $assessment_id"
          else
            echo "No saved assessment yet; profile empty-state API is valid."
          fi

      - name: Validate profile UI
        shell: bash
        run: |
          node <<'NODE'
          const { chromium }=require('playwright-core');
          const APP=process.env.APP_URL;
          (async()=>{
            const browser=await chromium.launch({
              executablePath:'/usr/bin/google-chrome',
              headless:true,
              args:['--no-sandbox','--disable-dev-shm-usage']
            });
            try{
              const page=await browser.newPage({viewport:{width:390,height:844}});
              await page.goto(APP,{waitUntil:'networkidle',timeout:120000});
              await page.locator('.bottom-nav [data-page="profile"]').click();
              await page.locator('#profileAnamnesisCard').waitFor({state:'visible',timeout:30000});
              await page.waitForFunction(()=>{
                const el=document.querySelector('#profileAnamnesisSubtitle');
                return el && el.textContent && !el.textContent.includes('Carregando');
              },null,{timeout:30000});
              const subtitle=await page.locator('#profileAnamnesisSubtitle').textContent();
              console.log('PASS profile anamnesis UI:',subtitle);
              await page.screenshot({path:'ritmox-profile-anamnesis.png',fullPage:true});
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload validation screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ritmox-v41-live-validation
          path: ritmox-profile-anamnesis.png
          if-no-files-found: ignore
