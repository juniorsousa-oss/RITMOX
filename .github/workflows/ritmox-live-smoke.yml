name: RITMOX live regression tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: https://ritmox.onrender.com
      EXPECTED_BUILD: "20260925-42"
    steps:
      - uses: actions/checkout@v4

      - name: Validate signed anamnesis save and PDF locally
        shell: bash
        env:
          DATABASE_URL: sqlite:////tmp/ritmox-v42-test.db
        run: |
          python -m pip install --quiet -r requirements.txt
          python - <<'PY'
          import json
          import app
          from sqlalchemy import select

          db=app.DB()
          try:
              questions=db.scalars(select(app.AnamnesisQuestion).where(app.AnamnesisQuestion.active == True).order_by(app.AnamnesisQuestion.position,app.AnamnesisQuestion.id)).all()
              answers={}
              for q in questions:
                  opts=json.loads(q.options_json or "[]")
                  if q.question_type=="yes_no": answers[str(q.id)]=False
                  elif q.question_type=="multiselect": answers[str(q.id)]=[opts[0]] if opts else ["Teste"]
                  elif q.question_type=="select": answers[str(q.id)]=opts[0] if opts else "Teste"
                  elif q.question_type=="date": answers[str(q.id)]="1990-01-01"
                  elif q.question_type=="number": answers[str(q.id)]=1
                  else: answers[str(q.id)]="Teste"
              signature="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVQIHWP4z8DwHwAFgAI/ScL7WQAAAABJRU5ErkJggg=="
              data=app.DynamicHealthAssessmentIn(
                  answers=answers,
                  consent_truthful=True,
                  consent_screening=True,
                  signature_name="Aluno Teste",
                  signature_data=signature,
                  signature_confirmed=True,
              )
              result=app.save_health_assessment(data,db)
              assert result["signature_status"]=="signed", result
              assert result["signature"]["signer_name"]=="Aluno Teste", result
              item=db.get(app.HealthAssessment,result["id"])
              pdf=app._assessment_pdf_buffer(item).getvalue()
              assert pdf[:4]==b"%PDF"
              assert len(pdf)>1000
              print("PASS signed save and PDF",result["id"],len(pdf))
          finally:
              db.close()
          PY

      - name: Wait for Render build
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..70}; do
            body="$(curl -fsS --max-time 20 "$APP_URL/api/version" || true)"
            echo "attempt=$attempt body=$body"
            if echo "$body" | grep -q "$EXPECTED_BUILD"; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: Install browser runtime
        run: npm install --no-save playwright-core

      - name: Validate aligned single-image home cards
        shell: bash
        run: |
          node <<'NODE'
          const { chromium }=require('playwright-core');
          const APP=process.env.APP_URL;
          (async()=>{
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              const p=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
              await p.goto(APP+'/?cardAlignment=v42',{waitUntil:'networkidle',timeout:120000});
              const strength=p.locator('.m-feature-strength');
              const run=p.locator('.m-feature-run');
              for(const [name,card,asset] of [
                ['strength',strength,'home-strength-mobile-v42.png'],
                ['run',run,'home-run-mobile-v42.png']
              ]){
                await card.waitFor({state:'visible',timeout:30000});
                const art=card.locator('.home-card-art');
                const src=await art.getAttribute('src');
                if(!src.includes(asset)) throw new Error(name+' wrong baked asset '+src);
                if(await card.locator('.m-feature-icon').count()) throw new Error(name+' still has separate icon');
                const box=await card.boundingBox();
                if(Math.abs(box.height-104)>1) throw new Error(name+' card height '+box.height);
              }
              const sb=await strength.boundingBox(), rb=await run.boundingBox();
              if(Math.abs(sb.x-rb.x)>0.5||Math.abs(sb.width-rb.width)>0.5) throw new Error('cards not aligned '+JSON.stringify({sb,rb}));
              await p.screenshot({path:'ritmox-v42-home.png',fullPage:true});
              console.log('PASS aligned home cards',JSON.stringify({sb,rb}));
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Validate explicit anamnesis errors and signature field
        shell: bash
        run: |
          node <<'NODE'
          const { chromium }=require('playwright-core');
          const APP=process.env.APP_URL;
          (async()=>{
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              const p=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
              await p.goto(APP+'/?anamnesisValidation=v42',{waitUntil:'networkidle',timeout:120000});
              await p.evaluate(async()=>{
                await loadAnamnesisFormConfig(true);
                renderDynamicAnamnesis();
                openDialogSafe(document.querySelector('#healthAssessmentDialog'));
                setupHealthSignaturePad();
              });
              await p.locator('#haSignatureCanvas').waitFor({state:'visible',timeout:30000});
              await p.locator('#submitHealthAssessmentBtn').click();
              const feedback=p.locator('#anamnesisFormFeedback');
              await feedback.waitFor({state:'visible',timeout:10000});
              const text=await feedback.textContent();
              if(!text.includes('pendências')) throw new Error('missing explicit pending message: '+text);
              const toast=p.locator('#toast');
              const z=await toast.evaluate(el=>Number(getComputedStyle(el).zIndex));
              if(z<10000) throw new Error('toast is behind modal: '+z);

              const canvas=p.locator('#haSignatureCanvas');
              const b=await canvas.boundingBox();
              await p.mouse.move(b.x+40,b.y+70);
              await p.mouse.down();
              await p.mouse.move(b.x+110,b.y+45,{steps:5});
              await p.mouse.move(b.x+180,b.y+80,{steps:5});
              await p.mouse.up();
              const ink=await p.evaluate(()=>state.health.signatureHasInk);
              if(!ink) throw new Error('signature pad did not register ink');
              await p.locator('#haConsentTruthful').click();
              await p.locator('#haConsentScreening').click();
              await p.locator('#haSignatureConfirm').click();
              if(await p.locator('#haSignatureConfirm').getAttribute('aria-checked')!=='true') throw new Error('signature confirmation not selectable');
              console.log('PASS explicit error and signature pad');
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Validate profile API and UI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$APP_URL/api/profile/anamnesis" >/tmp/profile.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/profile.json'))
          assert set(('latest','history','count')).issubset(p)
          print('PROFILE_COUNT',p['count'])
          PY
          node <<'NODE'
          const { chromium }=require('playwright-core');
          const APP=process.env.APP_URL;
          (async()=>{
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              const p=await browser.newPage({viewport:{width:390,height:844}});
              await p.goto(APP,{waitUntil:'networkidle',timeout:120000});
              await p.locator('.bottom-nav [data-page="profile"]').click();
              await p.waitForFunction(()=>{const el=document.querySelector('#profileAnamnesisSubtitle');return el&&el.textContent&&!el.textContent.includes('Carregando')},{timeout:30000});
              console.log('PASS profile UI',await p.locator('#profileAnamnesisSubtitle').textContent());
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload v42 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ritmox-v42-live-validation
          path: ritmox-v42-home.png
          if-no-files-found: ignore
