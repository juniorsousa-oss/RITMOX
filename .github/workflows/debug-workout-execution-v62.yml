name: Debug workout execution v62

on:
  push:
    branches: [debug-workout-execution-v62]

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Install browser runtime
        run: npm install --no-save playwright-core

      - name: Inspect first strength set end to end
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {chromium}=require('playwright-core');
          const APP='https://ritmox.onrender.com';
          async function api(path,options={}){
            const r=await fetch(APP+path,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});
            const text=await r.text();
            if(!r.ok) throw new Error(path+' '+r.status+' '+text);
            return text?JSON.parse(text):null;
          }
          (async()=>{
            const plan=await api('/api/training-plans',{
              method:'POST',
              body:JSON.stringify({
                planned_date:'2099-12-20',
                title:'TESTE EXECUÇÃO V62',
                modality:'musculacao',
                duration_min:30,
                notes:'RITMOX_TEST_EXEC_V62',
                exercises:[],
                blocks:[
                  {kind:'strength',name:'Supino teste',detail:'Peito',sets_total:2,reps:'8',load_kg:40,distance_km:0,duration_min:0,pace_target:'',repetitions:0,rest_sec:2,intensity:''}
                ]
              })
            });
            console.log('PLAN_ID',plan.id);

            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[];
            page.on('pageerror',e=>{errors.push(String(e));console.log('PAGEERROR',String(e));});
            page.on('console',m=>{if(m.type()==='error') console.log('CONSOLE_ERROR',m.text());});
            await page.goto(APP+'/?debugExecution=v62-first-set',{waitUntil:'networkidle',timeout:120000});
            console.log('BUILD',await page.evaluate(()=>fetch('/api/version').then(r=>r.json())));

            await page.evaluate(id=>openPlannedWorkout(id),plan.id);
            await page.locator('#workoutExecutionDialog').waitFor({state:'visible',timeout:15000});
            console.log('EXERCISE_BEFORE',await page.locator('#workoutExerciseName').textContent());
            console.log('LOAD_BEFORE',await page.locator('#workoutActualLoad').inputValue());

            await page.locator('#workoutActualReps').fill('8');
            await page.locator('#workoutActualLoad').fill('42.5');
            const responsePromise=page.waitForResponse(r=>r.url().includes('/api/exercises/')&&r.url().includes('/complete-set')&&r.request().method()==='POST',{timeout:15000});
            await page.locator('#completeWorkoutSetBtn').click();
            const response=await responsePromise;
            console.log('COMPLETE_STATUS',response.status());
            console.log('COMPLETE_BODY',await response.text());
            await page.waitForTimeout(1200);
            console.log('HISTORY_HTML',await page.locator('#workoutSetHistory').innerHTML());
            console.log('DONE_ROWS',await page.locator('.workout-set-row.done').count());
            console.log('REST_VISIBLE',await page.locator('#workoutRestTimer').isVisible());
            console.log('ERRORS',JSON.stringify(errors));
            console.log('WORKOUT_ID',await page.evaluate(()=>state.workout?.id));

            await api('/api/training-plans/'+plan.id,{method:'DELETE'});
            await browser.close();
            if(errors.length) process.exit(3);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
