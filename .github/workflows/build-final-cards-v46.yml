name: Build final approved home card images v46

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-final-cards-v46.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install browser runtime
        run: npm install --no-save playwright-core
      - name: Build final card PNGs
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const { chromium }=require('playwright-core');

          const cards=[
            {kind:'strength', label:'TREINO DE HOJE', title:'Musculação', subtitle:'Nenhum treino programado'},
            {kind:'run', label:'CORRIDA', title:'Corrida', subtitle:'Nenhuma corrida registrada'}
          ];

          (async()=>{
            const browser=await chromium.launch({
              executablePath:'/usr/bin/google-chrome',
              headless:true,
              args:['--no-sandbox','--disable-dev-shm-usage']
            });
            try{
              for(const mode of ['mobile','desktop']){
                const width=mode==='mobile'?716:1168;
                const height=mode==='mobile'?208:356;
                const baseSuffix=mode==='mobile'?'mobile-v42':'desktop-v42';

                for(const card of cards){
                  const basePath=`static/assets/home/home-${card.kind}-${baseSuffix}.png`;
                  const base='data:image/png;base64,'+fs.readFileSync(basePath).toString('base64');
                  const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});

                  const css=mode==='mobile'
                    ? `
                      *{box-sizing:border-box}
                      html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06101d}
                      .card{position:absolute;inset:0;background:url("${base}") center/100% 100% no-repeat}
                      .copy{position:absolute;left:180px;top:47px;width:455px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5)}
                      .label{font-family:Arial,sans-serif;font-size:18px;line-height:1.1;font-weight:400;letter-spacing:4px;color:#c9d0dc;margin-bottom:10px}
                      .title{font-family:Arial,sans-serif;font-size:39px;line-height:1.05;font-weight:800;color:#fff;margin-bottom:10px}
                      .sub{font-family:Arial,sans-serif;font-size:22px;line-height:1.15;font-weight:400;color:#e3e7ee;white-space:nowrap}
                      .arrow{position:absolute;right:53px;top:68px;font-family:Arial,sans-serif;font-size:65px;line-height:1;font-weight:300;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5)}
                    `
                    : `
                      *{box-sizing:border-box}
                      html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06101d}
                      .card{position:absolute;inset:0;background:url("${base}") center/100% 100% no-repeat}
                      .copy{position:absolute;left:150px;top:78px;width:790px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5)}
                      .label{font-family:Arial,sans-serif;font-size:24px;line-height:1.1;font-weight:400;letter-spacing:5px;color:#c9d0dc;margin-bottom:12px}
                      .title{font-family:Arial,sans-serif;font-size:49px;line-height:1.05;font-weight:800;color:#fff;margin-bottom:13px}
                      .sub{font-family:Arial,sans-serif;font-size:27px;line-height:1.15;font-weight:400;color:#e3e7ee;white-space:nowrap}
                      .arrow{position:absolute;right:57px;top:118px;font-family:Arial,sans-serif;font-size:78px;line-height:1;font-weight:300;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5)}
                    `;

                  await page.setContent(`<!doctype html><html><head><style>${css}</style></head><body>
                    <div class="card">
                      <div class="copy">
                        <div class="label">${card.label}</div>
                        <div class="title">${card.title}</div>
                        <div class="sub">${card.subtitle}</div>
                      </div>
                      <div class="arrow">›</div>
                    </div>
                  </body></html>`,{waitUntil:'networkidle'});

                  await page.locator('.card').screenshot({
                    path:`static/assets/home/home-${card.kind}-final-${mode}-v46.png`
                  });
                  await page.close();
                }
              }
            } finally {
              await browser.close();
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit final approved images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/assets/home/home-*-final-*-v46.png
          git commit -m "assets: add final approved home card images v46"
          git push
