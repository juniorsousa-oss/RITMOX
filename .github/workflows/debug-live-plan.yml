name: Debug live training plan apply

on:
  push:
    branches: [debug-plan-apply-v60]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe valid live plan creation in isolated future date
        shell: bash
        run: |
          set -euo pipefail
          APP="https://ritmox.onrender.com"
          echo "=== HEALTH ==="
          curl -sS "$APP/health"
          echo
          echo "=== VALID APPLY 2099 ==="
          code="$(curl -sS -o /tmp/valid.json -w "%{http_code}" -X POST "$APP/api/training-program/apply"             -H "Content-Type: application/json"             --data '{"method_key":"strength","start_date":"2099-12-28","weeks":1}' || true)"
          echo "VALID_HTTP=$code"
          cat /tmp/valid.json || true
          echo
          echo "=== READ BACK ==="
          curl -sS "$APP/api/training-plans?start_date=2099-12-28&end_date=2100-01-03"
          echo
