name: V57 branch validation

on:
  push:
    branches: [training-planner-v57]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: sqlite:////tmp/ritmox-v57-branch.db
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt
      - name: Syntax checks
        run: |
          python -m py_compile app.py
          node --check static/app.js
      - name: Validate structured training methods
        run: |
          python - <<'PY'
          from sqlalchemy import select
          import app

          db=app.DB()
          try:
              db.add(app.HealthAssessment(
                  payload_json="{}",
                  risk_status="screening_complete",
                  red_flags_json="[]",
                  professional_clearance=False,
                  clearance_provider="",
                  clearance_date="",
              ))
              db.commit()

              manual=app.WorkoutPlan(
                  planned_date="2026-09-28",
                  title="Manual",
                  modality="musculacao",
                  duration_min=45,
                  notes="manual",
              )
              db.add(manual); db.commit()

              methods=app.list_training_methods()
              assert {m["key"] for m in methods}=={"hypertrophy","strength","weight_loss","conditioning"}

              for key in ("hypertrophy","strength","weight_loss","conditioning"):
                  result=app.apply_training_program(
                      app.TrainingProgramApplyIn(method_key=key,start_date="2026-09-28",weeks=2),
                      db,
                  )
                  assert result["created_count"]>0
                  assert db.get(app.WorkoutPlan,manual.id) is not None
                  generated=db.scalars(
                      select(app.WorkoutPlan).where(app.WorkoutPlan.notes.like("RITMOX_METHOD:%"))
                  ).all()
                  assert generated
                  assert all(p.notes.startswith("RITMOX_METHOD:"+key) for p in generated)
              print("V57 structured planner validation OK")
          finally:
              db.close()
          PY
