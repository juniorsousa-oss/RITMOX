name: Build RITMOX home card assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-home-cards.yml"

permissions:
  contents: write

jobs:
  build-home-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install browser runtime
        run: npm install --no-save playwright-core

      - name: Wait for current Render version
        shell: bash
        run: |
          for i in {1..30}; do
            if curl -fsS https://ritmox.onrender.com/api/version >/tmp/version.json; then
              cat /tmp/version.json
              break
            fi
            sleep 5
          done

      - name: Capture clean single-image card artwork
        shell: bash
        run: |
          mkdir -p static/assets/home
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const APP='https://ritmox.onrender.com';
          (async()=>{
            const browser=await chromium.launch({
              executablePath:'/usr/bin/google-chrome',
              headless:true,
              args:['--no-sandbox','--disable-dev-shm-usage']
            });
            try{
              const mobile=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:2});
              await mobile.goto(APP+'/?assetBuild=1',{waitUntil:'networkidle',timeout:120000});
              await mobile.addStyleTag({content:`
                .m-feature-card .m-feature-copy,.m-feature-card .m-feature-arrow{visibility:hidden!important}
                .m-feature-strength .m-feature-icon,.m-feature-run .m-feature-icon{
                  width:58px!important;height:58px!important;min-width:58px!important;min-height:58px!important;
                  display:grid!important;place-items:center!important;overflow:visible!important;padding:0!important;
                }
                .m-feature-strength .m-feature-icon img{
                  width:44px!important;height:44px!important;min-width:44px!important;min-height:44px!important;
                  max-width:44px!important;max-height:44px!important;transform:none!important;position:static!important;
                  object-fit:contain!important;object-position:center!important;margin:0!important;padding:0!important;
                }
                .m-feature-run .m-feature-icon img{
                  width:44px!important;height:44px!important;min-width:44px!important;min-height:44px!important;
                  max-width:44px!important;max-height:44px!important;transform:none!important;position:static!important;
                  object-fit:contain!important;object-position:center!important;margin:0!important;padding:0!important;
                }
              `});
              await mobile.locator('.m-feature-strength').screenshot({path:'static/assets/home/home-strength-mobile.png'});
              await mobile.locator('.m-feature-run').screenshot({path:'static/assets/home/home-run-mobile.png'});
              await mobile.close();

              const desktop=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:2});
              await desktop.goto(APP+'/?assetBuild=1',{waitUntil:'networkidle',timeout:120000});
              await desktop.addStyleTag({content:`
                .hero-card .hero-card-head h2,.hero-card .hero-chevron,.hero-card .hero-card-body,.hero-card .hero-action{
                  visibility:hidden!important
                }
                .strength-card .hero-icon,.run-card .hero-icon{
                  width:50px!important;height:50px!important;min-width:50px!important;min-height:50px!important;
                  display:grid!important;place-items:center!important;overflow:visible!important;padding:0!important;
                }
                .strength-card .hero-icon img,.run-card .hero-icon img{
                  width:38px!important;height:38px!important;min-width:38px!important;min-height:38px!important;
                  max-width:38px!important;max-height:38px!important;transform:none!important;position:static!important;
                  object-fit:contain!important;object-position:center!important;margin:0!important;padding:0!important;
                }
              `});
              await desktop.locator('.strength-card').screenshot({path:'static/assets/home/home-strength-desktop.png'});
              await desktop.locator('.run-card').screenshot({path:'static/assets/home/home-run-desktop.png'});
              await desktop.close();
            } finally {
              await browser.close();
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Commit generated card assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/assets/home/*.png
          if git diff --cached --quiet; then
            echo "No asset changes"
            exit 0
          fi
          git commit -m "assets: bake home strength and run cards as single images"
          git push
